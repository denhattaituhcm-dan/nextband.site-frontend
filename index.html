  <!-- Global Stylesheet Resilience Listener -->
  <script>
    (function () {
      var CSS_RELOAD_KEY = "nb_css_reload_ts";
      window.addEventListener(
        "error",
        function (event) {
          var target = event.target || event.srcElement;
          if (target && target.tagName === "LINK" && target.rel === "stylesheet") {
            var now = Date.now();
            var lastReload = Number(sessionStorage.getItem(CSS_RELOAD_KEY) || 0);
            if (!lastReload || now - lastReload > 15000) {
              sessionStorage.setItem(CSS_RELOAD_KEY, String(now));
              window.location.reload();
            } else {
              console.error("[CRITICAL_CSS_LOAD_FAILED] Stylesheet failed to load persistently:", target.href);
            }
          }
        },
        true
      );
    })();
  </script>
